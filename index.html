
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>完成版エイムゲーム</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { margin:0; text-align:center; font-family:sans-serif; }

canvas { max-width:90%; margin:10px; }

/* ✅ マーカー完全固定 */
#crosshair{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:30px;
  height:30px;
  border:3px solid lime;
  border-radius:50%;
  pointer-events:none;
}

/* ✅ ターゲット */
#target{
  position:fixed;
  width:20px;
  height:20px;
  background:blue;
  border-radius:50%;
}

#score{
  position:fixed;
  top:10px;
  left:10px;
  font-size:20px;
  background:white;
  padding:5px;
}
</style>
</head>

<body>

<h2>傾きエイムゲーム</h2>

<button id="startBtn">開始</button>
<button id="resetBtn">リセット</button>

<div id="score">Score: 0</div>

<div id="crosshair"></div>
<div id="target"></div>

<canvas id="accChart"></canvas>
<canvas id="oriChart"></canvas>

<script>
// ===== センサー =====
let acc={x:0,y:0,z:0};
let ori={alpha:0,beta:0,gamma:0};
let offset={ori:{}};

let score=0;
let isHit=false;

// ===== ターゲット =====
let targetPos={
  x:window.innerWidth/2,
  y:window.innerHeight/2
};
let targetVel={x:0,y:0};

const target=document.getElementById("target");
const crosshair=document.getElementById("crosshair");

// ===== センサー開始 =====
document.getElementById("startBtn").onclick = async ()=>{
  if(DeviceMotionEvent.requestPermission){
    const p=await DeviceMotionEvent.requestPermission();
    if(p!=="granted") return;
  }
  window.addEventListener("devicemotion",motion);
  window.addEventListener("deviceorientation",orientation);
};

// ===== センサー取得 =====
function motion(e){
  acc.x=e.accelerationIncludingGravity.x||0;
  acc.y=e.accelerationIncludingGravity.y||0;
  acc.z=e.accelerationIncludingGravity.z||0;

  updateCharts();
  updateTarget();
  checkHit();
}

function orientation(e){
  ori.alpha=e.alpha||0;
  ori.beta=e.beta||0;
  ori.gamma=e.gamma||0;
}

// ===== ✅ 傾きでターゲット移動（安定版） =====
function updateTarget(){
  let cx = window.innerWidth/2;
  let cy = window.innerHeight/2;
  let radius = 300;

  let sensitivity = 3;

  let gx = ori.gamma - (offset.ori.gamma || 0);
  let by = ori.beta - (offset.ori.beta || 0);

  // ✅ 垂直補正
  by = by - 90;

  // ✅ 暴走防止（超重要）
  gx = Math.max(-30, Math.min(30, gx));
  by = Math.max(-30, Math.min(30, by));

  // ✅ 微振動カット
  if(Math.abs(gx)<1) gx=0;
  if(Math.abs(by)<1) by=0;

  let dx = gx * sensitivity;
  let dy = by * sensitivity;

  // 視点移動
  let targetX = cx - dx;
  let targetY = cy - dy;

  // なめらか補間
  targetPos.x += (targetX - targetPos.x)*0.15;
  targetPos.y += (targetY - targetPos.y)*0.15;

  // ランダム動き
  targetVel.x += (Math.random()-0.5)*1.2;
  targetVel.y += (Math.random()-0.5)*1.2;

  targetVel.x *= 0.95;
  targetVel.y *= 0.95;

  targetPos.x += targetVel.x;
  targetPos.y += targetVel.y;

  // ✅ 円制限
  let dx2 = targetPos.x - cx;
  let dy2 = targetPos.y - cy;
  let dist = Math.sqrt(dx2*dx2 + dy2*dy2);

  if(dist > radius){
    let ang = Math.atan2(dy2,dx2);
    targetPos.x = cx + Math.cos(ang)*radius;
    targetPos.y = cy + Math.sin(ang)*radius;
  }

  target.style.left = targetPos.x + "px";
  target.style.top  = targetPos.y + "px";
}

// ===== ✅ 当たり判定（距離ベース） =====
function checkHit(){
  let cx = window.innerWidth/2;
  let cy = window.innerHeight/2;

  let dx = cx - targetPos.x;
  let dy = cy - targetPos.y;

  let dist = Math.sqrt(dx*dx + dy*dy);

  isHit = dist < 25;

  crosshair.style.borderColor = isHit ? "red":"lime";
}

// ===== ✅ タップ =====
document.body.addEventListener("click",()=>{
  if(isHit){
    score++;
    document.getElementById("score").innerText="Score: "+score;
    teleportTarget();
  }
});

// ===== ✅ 瞬間移動 =====
function teleportTarget(){
  let cx = window.innerWidth/2;
  let cy = window.innerHeight/2;
  let r = 300;

  let ang = Math.random()*Math.PI*2;
  let dist = Math.random()*r;

  targetPos.x = cx + Math.cos(ang)*dist;
  targetPos.y = cy + Math.sin(ang)*dist;

  targetVel={x:0,y:0};
}

// ===== グラフ =====
const maxData=50;
function createChart(ctx){
  return new Chart(ctx,{
    type:'line',
    data:{
      labels:[],
      datasets:[
        {label:'X',data:[],borderColor:'red'},
        {label:'Y',data:[],borderColor:'green'},
        {label:'Z',data:[],borderColor:'blue'}
      ]
    },
    options:{animation:false}
  });
}

const accChart=createChart(document.getElementById("accChart"));
const oriChart=createChart(document.getElementById("oriChart"));

function push(arr,val){
  arr.push(val);
  if(arr.length>maxData) arr.shift();
}

function updateCharts(){
  push(accChart.data.datasets[0].data,acc.x);
  push(accChart.data.datasets[1].data,acc.y);
  push(accChart.data.datasets[2].data,acc.z);

  push(oriChart.data.datasets[0].data,ori.beta);
  push(oriChart.data.datasets[1].data,ori.gamma);
  push(oriChart.data.datasets[2].data,ori.alpha);

  accChart.update();
  oriChart.update();
}

// ===== ✅ リセット =====
document.getElementById("resetBtn").onclick=()=>{
  offset.ori={...ori};
};
</script>

</body>
</html>
