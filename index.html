
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>センサー + グラフ + ターゲット</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { text-align:center; font-family:sans-serif; }

canvas { max-width: 90%; margin: 10px; }

/* 中央ターゲットマーカー */
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border: 2px solid lime;
  border-radius: 50%;
  pointer-events: none;
}

/* ランダムターゲット */
#target {
  position: fixed;
  width: 20px;
  height: 20px;
  background: blue;
  border-radius: 50%;
}
</style>
</head>
<body>

<h2>スマホセンサーグラフ + ターゲット</h2>

<button id="startBtn">開始</button>
<button id="resetBtn">リセット</button>

<div id="crosshair"></div>
<div id="target"></div>

<canvas id="accChart"></canvas>
<canvas id="posChart"></canvas>
<canvas id="oriChart"></canvas>

<script>
// ------------------- データ -------------------
let acc={x:0,y:0,z:0};
let vel={x:0,y:0,z:0};
let pos={x:0,y:0,z:0};
let ori={alpha:0,beta:0,gamma:0};

let offset={acc:{},pos:{},ori:{}};
let lastTime=null;

// グラフ用データ
const maxData=50;
let accData={x:[],y:[],z:[]};
let posData={x:[],y:[],z:[]};
let oriData={x:[],y:[],z:[]};

// ------------------- グラフ作成 -------------------
function createChart(ctx,label){
  return new Chart(ctx,{
    type:'line',
    data:{
      labels:[],
      datasets:[
        {label:'X',data:[],borderColor:'red'},
        {label:'Y',data:[],borderColor:'green'},
        {label:'Z',data:[],borderColor:'blue'}
      ]
    },
    options:{animation:false,scales:{y:{beginAtZero:true}}}
  });
}
const accChart=createChart(document.getElementById('accChart'),"加速度");
const posChart=createChart(document.getElementById('posChart'),"位置");
const oriChart=createChart(document.getElementById('oriChart'),"角度");

// ------------------- センサー開始 -------------------
document.getElementById("startBtn").onclick = async ()=>{
  if(DeviceMotionEvent.requestPermission){
    const p=await DeviceMotionEvent.requestPermission();
    if(p!=='granted')return;
  }
  window.addEventListener("devicemotion",motion);
  window.addEventListener("deviceorientation",orientation);
  moveTarget();
};

function motion(e){
  const now=Date.now();
  if(!lastTime) lastTime=now;
  const dt=(now-lastTime)/1000;
  lastTime=now;

  acc.x=e.accelerationIncludingGravity.x||0;
  acc.y=e.accelerationIncludingGravity.y||0;
  acc.z=e.accelerationIncludingGravity.z||0;

  vel.x+=acc.x*dt;
  vel.y+=acc.y*dt;
  vel.z+=acc.z*dt;

  pos.x+=vel.x*dt;
  pos.y+=vel.y*dt;
  pos.z+=vel.z*dt;

  updateCharts();
  checkHit();
}

function orientation(e){
  ori.alpha=e.alpha||0;
  ori.beta=e.beta||0;
  ori.gamma=e.gamma||0;
}

// ------------------- グラフ更新 -------------------
function pushData(arr,val){
  arr.push(val);
  if(arr.length>maxData) arr.shift();
}

function updateCharts(){
  // データ取得
  let ax=acc.x-(offset.acc.x||0);
  let ay=acc.y-(offset.acc.y||0);
  let az=acc.z-(offset.acc.z||0);

  let px=pos.x-(offset.pos.x||0);
  let py=pos.y-(offset.pos.y||0);
  let pz=pos.z-(offset.pos.z||0);

  let ox=ori.beta-(offset.ori.beta||0);
  let oy=ori.gamma-(offset.ori.gamma||0);
  let oz=ori.alpha-(offset.ori.alpha||0);

  pushData(accData.x,ax);
  pushData(accData.y,ay);
  pushData(accData.z,az);

  pushData(posData.x,px);
  pushData(posData.y,py);
  pushData(posData.z,pz);

  pushData(oriData.x,ox);
  pushData(oriData.y,oy);
  pushData(oriData.z,oz);

  updateChart(accChart,accData);
  updateChart(posChart,posData);
  updateChart(oriChart,oriData);
}

function updateChart(chart,data){
  chart.data.labels.push('');
  if(chart.data.labels.length>maxData) chart.data.labels.shift();

  chart.data.datasets[0].data=data.x;
  chart.data.datasets[1].data=data.y;
  chart.data.datasets[2].data=data.z;

  chart.update();
}

// ------------------- リセット -------------------
document.getElementById("resetBtn").onclick=()=>{
  offset.acc={...acc};
  offset.pos={...pos};
  offset.ori={...ori};
};

// ------------------- ターゲット -------------------
const target=document.getElementById("target");
const crosshair=document.getElementById("crosshair");

let targetPos={x:0,y:0};

function moveTarget(){
  targetPos.x=Math.random()*window.innerWidth;
  targetPos.y=Math.random()*window.innerHeight;

  target.style.left=targetPos.x+'px';
  target.style.top=targetPos.y+'px';
}

// ------------------- 当たり判定 -------------------
function checkHit(){
  // 傾き → 画面座標変換（簡易）
  let cx=window.innerWidth/2 + ori.gamma*5;
  let cy=window.innerHeight/2 + ori.beta*5;

  const dx=cx-targetPos.x;
  const dy=cy-targetPos.y;

  if(Math.abs(dx)<30 && Math.abs(dy)<30){
    crosshair.style.borderColor='red';
    setTimeout(()=>{
      moveTarget();
      crosshair.style.borderColor='lime';
    },500);
  }else{
    crosshair.style.borderColor='lime';
  }
}
</script>

</body>
</html>
