
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>センサーゲーム完成版</title>

<!-- ✅ Chart.js 正しい読み込み -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { text-align:center; font-family:sans-serif; }

canvas { max-width: 90%; margin: 10px; }

/* 中央マーカー */
#crosshair {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -50%);
  border: 3px solid lime;
  border-radius: 50%;
}

/* ターゲット */
#target {
  position: fixed;
  width: 20px;
  height: 20px;
  background: blue;
  border-radius: 50%;
}

/* スコア */
#score {
  position: fixed;
  top: 10px;
  left: 10px;
  font-size: 20px;
}
</style>
</head>

<body>

<h2>スマホエイムゲーム</h2>

<button id="startBtn">開始</button>
<button id="resetBtn">リセット</button>

<div id="score">Score: 0</div>

<div id="crosshair"></div>
<div id="target"></div>

<canvas id="accChart"></canvas>
<canvas id="posChart"></canvas>
<canvas id="oriChart"></canvas>

<script>
// ===== データ =====
let acc={x:0,y:0,z:0};
let vel={x:0,y:0,z:0};
let pos={x:0,y:0,z:0};
let ori={alpha:0,beta:0,gamma:0};

let offset={acc:{},pos:{},ori:{}};
let lastTime=null;

let score=0;
let isHit=false;

// ===== ターゲット位置 =====
let targetPos={
  x:window.innerWidth/2,
  y:window.innerHeight/2
};

let targetVel={x:0,y:0};

// ===== グラフ =====
const maxData=50;

function createChart(ctx){
  return new Chart(ctx,{
    type:'line',
    data:{
      labels:[],
      datasets:[
        {label:'X',data:[],borderColor:'red'},
        {label:'Y',data:[],borderColor:'green'},
        {label:'Z',data:[],borderColor:'blue'}
      ]
    },
    options:{animation:false}
  });
}

const accChart=createChart(document.getElementById('accChart'));
const posChart=createChart(document.getElementById('posChart'));
const oriChart=createChart(document.getElementById('oriChart'));

// ===== センサー開始 =====
document.getElementById("startBtn").onclick = async ()=>{
  if(DeviceMotionEvent.requestPermission){
    const p=await DeviceMotionEvent.requestPermission();
    if(p!=='granted') return;
  }
  window.addEventListener("devicemotion",motion);
  window.addEventListener("deviceorientation",orientation);
};

// ===== センサー =====
function motion(e){
  const now=Date.now();
  if(!lastTime) lastTime=now;
  const dt=(now-lastTime)/1000;
  lastTime=now;

  acc.x=e.accelerationIncludingGravity.x||0;
  acc.y=e.accelerationIncludingGravity.y||0;
  acc.z=e.accelerationIncludingGravity.z||0;

  vel.x+=acc.x*dt;
  vel.y+=acc.y*dt;
  vel.z+=acc.z*dt;

  pos.x+=vel.x*dt;
  pos.y+=vel.y*dt;
  pos.z+=vel.z*dt;

  updateCharts();
  updateTargetMove();   // ランダム移動
  checkHit();
}

function orientation(e){
  ori.alpha=e.alpha||0;
  ori.beta=e.beta||0;   // 前後
  ori.gamma=e.gamma||0; // 左右
}

// ===== 垂直基準の操作 =====
function getAimPosition(){
  // 垂直にしたとき中央になるよう補正
  let x = window.innerWidth/2 + ori.gamma * 5;
  let y = window.innerHeight/2 + (ori.beta - 90) * 5;

  return {x,y};
}

// ===== ターゲット ランダム移動 =====
function updateTargetMove(){
  let centerX = window.innerWidth/2;
  let centerY = window.innerHeight/2;
  let radius = 300;

  // ランダム加速
  targetVel.x += (Math.random()-0.5)*2;
  targetVel.y += (Math.random()-0.5)*2;

  // 摩擦
  targetVel.x *= 0.95;
  targetVel.y *= 0.95;

  targetPos.x += targetVel.x;
  targetPos.y += targetVel.y;

  // 円内制限
  let dx = targetPos.x-centerX;
  let dy = targetPos.y-centerY;
  let dist = Math.sqrt(dx*dx+dy*dy);

  if(dist > radius){
    let angle=Math.atan2(dy,dx);
    targetPos.x=centerX+Math.cos(angle)*radius;
    targetPos.y=centerY+Math.sin(angle)*radius;
  }

  target.style.left=targetPos.x+"px";
  target.style.top=targetPos.y+"px";
}

// ===== 当たり判定 =====
function checkHit(){
  const aim=getAimPosition();

  const dx = aim.x - targetPos.x;
  const dy = aim.y - targetPos.y;

  isHit = Math.abs(dx)<20 && Math.abs(dy)<20;

  crosshair.style.borderColor = isHit ? "red":"lime";
}

// ===== タップ判定 =====
document.body.addEventListener("click",()=>{
  if(isHit){
    score++;
    document.getElementById("score").innerText="Score: "+score;
    teleportTarget();
  }
});

// ===== 瞬間移動 =====
function teleportTarget(){
  let centerX = window.innerWidth/2;
  let centerY = window.innerHeight/2;
  let radius = 300;

  let angle = Math.random()*Math.PI*2;
  let r = Math.random()*radius;

  targetPos.x = centerX + Math.cos(angle)*r;
  targetPos.y = centerY + Math.sin(angle)*r;

  targetVel={x:0,y:0};
}

// ===== グラフ =====
function push(arr,val){
  arr.push(val);
  if(arr.length>maxData) arr.shift();
}

function updateCharts(){
  let ax=acc.x-(offset.acc.x||0);
  let ay=acc.y-(offset.acc.y||0);
  let az=acc.z-(offset.acc.z||0);

  let px=pos.x-(offset.pos.x||0);
  let py=pos.y-(offset.pos.y||0);
  let pz=pos.z-(offset.pos.z||0);

  let ox=ori.beta-(offset.ori.beta||0);
  let oy=ori.gamma-(offset.ori.gamma||0);
  let oz=ori.alpha-(offset.ori.alpha||0);

  push(accChart.data.datasets[0].data,ax);
  push(accChart.data.datasets[1].data,ay);
  push(accChart.data.datasets[2].data,az);

  push(posChart.data.datasets[0].data,px);
  push(posChart.data.datasets[1].data,py);
  push(posChart.data.datasets[2].data,pz);

  push(oriChart.data.datasets[0].data,ox);
  push(oriChart.data.datasets[1].data,oy);
  push(oriChart.data.datasets[2].data,oz);

  accChart.update();
  posChart.update();
  oriChart.update();
}

// ===== リセット =====
document.getElementById("resetBtn").onclick=()=>{
  offset.acc={...acc};
  offset.pos={...pos};
  offset.ori={...ori};
};
</script>

</body>
</html>
